# Builds the module on GitHub's Linux runners.
#
# The repository's own offline pipeline (scripts/legacy/build.ps1, retired) drove a
# vendored JDK and Android SDK under .tools/, which is git-ignored because it is
# ~2.4 GB. A runner has no such directory, so this workflow uses the Gradle build
# the repository already declares - it needs nothing beyond the checkout, the
# tracked .tools/maven repository and public Maven artifacts.
#
# Ordinary CI never receives production signing keys and produces unsigned APKs.
name: build

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionName:
        description: versionName to stamp
        required: false
        default: ''
      versionCode:
        description: versionCode to stamp (must be higher than the installed one)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK platform 37 + build-tools
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOLS="$(ls -1d "$SDK"/cmdline-tools/*/bin 2>/dev/null | tail -1)"
          export PATH="$TOOLS:$PATH"
          # The image already ships cmdline-tools; android-actions/setup-android is
          # not used because it insists on installing the retired "tools" package,
          # which no longer exists in the repository and fails the step outright.
          #
          # API 37 also ships as minor releases: there is no "platforms;android-37",
          # only 37.0 / 37.1 / 37.2.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" \
            || sdkmanager --channel=3 --install "platforms;android-37.2" "build-tools;37.0.0"
          ls -1 "$SDK/platforms"
          # compileSdk 37 reads the platform directory named android-37, while the
          # package installs as android-37.<minor>: make one name point at the other
          # instead of pinning the build to whichever minor happens to be current.
          if [ ! -d "$SDK/platforms/android-37" ]; then
            minor=$(ls -1d "$SDK"/platforms/android-37.* 2>/dev/null | head -1)
            if [ -n "$minor" ]; then
              ln -sfn "$(basename "$minor")" "$SDK/platforms/android-37"
            fi
          fi
          ls -l "$SDK/platforms"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Verify Gradle Wrapper
        run: python3 scripts/check-wrapper.py

      - name: Resolve version
        id: stamp
        env:
          INPUT_NAME: ${{ github.event.inputs.versionName }}
          INPUT_CODE: ${{ github.event.inputs.versionCode }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          stamp = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines()
                       if line.strip() and not line.startswith('#'))
          name = os.environ.get('INPUT_NAME') or (
              os.environ['REF_NAME'].removeprefix('v') if os.environ['REF_TYPE'] == 'tag' else stamp['versionName']
          )
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?', name):
              raise SystemExit('Expected a semantic version such as 1.0.0')
          if name != stamp['versionName'] and not os.environ.get('INPUT_CODE'):
              raise SystemExit('Update version.properties for this tag, or provide an explicit versionCode')
          code = int(os.environ.get('INPUT_CODE') or stamp['versionCode'])
          if not 0 < code <= 2100000000:
              raise SystemExit('Invalid Android versionCode')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\ncode={code}\n')
          PY

      - name: ColorOS policy and configuration checks
        run: |
          bash tests/coloros-observer.sh
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Android Lint gate
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :render-tests:test :app:lintRelease

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PcolorduoVersionName="${{ steps.stamp.outputs.name }}" \
            -PcolorduoVersionCode="${{ steps.stamp.outputs.code }}"

      - name: Collect
        run: |
          python3 scripts/check-observer.py app/build/outputs/apk/release/app-release-unsigned.apk --expect absent
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "dist/ColorDuo-${{ steps.stamp.outputs.name }}-unsigned.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ColorDuo-${{ steps.stamp.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      # Formal signing/publishing is handled by the protected release workflow.
